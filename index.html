<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TumbasAkun.id</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Samping Minimalis -->
    <header>
        <!-- Icon Menu -->
        <button class="menu-btn" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <!-- Icon Bendera Indonesia -->
        <div class="flag-icon" title="Indonesia">
            <svg width="32" height="20" viewBox="0 0 32 20">
                <rect width="32" height="10" fill="#E70011"/>
                <rect y="10" width="32" height="10" fill="#FFFFFF"/>
            </svg>
        </div>
    </header>

</body>
</html>
