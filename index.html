<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUMBASAKUN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Atas -->
    <header>
        <button class="menu-btn" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="flag-icon" title="Indonesia">
            <svg width="32" height="20" viewBox="0 0 32 20">
                <rect width="32" height="10" fill="#E70011"/>
                <rect y="10" width="32" height="10" fill="#FFFFFF"/>
            </svg>
        </div>
    </header>

    <!-- Banner Utama / Hero Section -->
    <section class="hero-section">
        <!-- Gambar Banner MLBB -->
        <div class="banner-img-container">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000" alt="Banner Top" class="banner-img">
        </div>

        <!-- Logo Bulat (TA) -->
        <div class="logo-circle">
            <span>TA</span>
        </div>

        <!-- Judul & Deskripsi Toko -->
        <h1 class="store-title">
    TUMBASAKUN 
    <svg class="verified-icon" width="18" height="18" viewBox="0 0 24 24" fill="#1d9bf0">
        <path d="M22.5 12.5c0-1.58-.8-2.96-2-3.77.42-1.51-.03-3.17-1.2-4.34-1.17-1.17-2.83-1.62-4.34-1.2C14.15 2 12.77 1.2 11.19 1.2c-1.58 0-2.96.8-3.77 2-.5-.14-1.03-.2-1.56-.2-1.87 0-3.55 1.05-4.35 2.7-.8 1.65-.47 3.63.83 4.93-1.3 1.3-1.63 3.28-.83 4.93.8 1.65 2.48 2.7 4.35 2.7.53 0 1.06-.06 1.56-.2.81 1.2 2.19 2 3.77 2 1.58 0 2.96-.8 3.77-2 1.51.42 3.17-.03 4.34-1.2 1.17-1.17 1.62-2.83 1.2-4.34 1.2-.81 2-2.19 2-3.77zm-11.41 4.47l-4.24-4.24 1.41-1.41 2.83 2.83 6.36-6.36 1.41 1.41-7.77 7.77z"/>
    </svg>
        </h1>
        <p class="store-desc">
            Khusus Jual Beli Akun Advance Server Mobile Legends.<br>
            Nikmati Akses Fitur dan Hero Terbaru Lebih Awal.
        </p>

        <!-- Tombol Aksi Oranye -->
        <div class="action-buttons">
            <button class="btn-orange">🛍️ Lihat Produk</button>
            <button class="btn-orange">📦 Cara Order</button>
        </div>
    </section>

        <!-- Bagian Katalog Produk -->
    <section class="products-section">
        <h2 class="section-title">Pilihan Akun</h2>

        <div class="product-grid">
            <!-- Kartu Produk 1 -->
            <div class="product-card">
                <div class="product-img-container">
                    <img src="https://images.unsplash.com/photo-1538481199705-c710c4e965fc?q=80&w=600" alt="Produk 1" class="product-img">
                </div>
                <div class="product-info">
                    <h3 class="product-name">Advance Server Lev 3 / 1s</h3>
                    <div class="price-container">
                        <span class="old-price">Rp 5.000</span>
                        <span class="new-price">Rp 2.000</span>
                    </div>
                </div>
            </div>
        </div>
    </section>

        <!-- Menu Navigasi Bawah (Bottom Nav) -->
    <nav class="bottom-nav">
        <a href="#" class="nav-item active">
            <span class="nav-icon">🏠</span>
            <span class="nav-label">Beranda</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">📋</span>
            <span class="nav-label">Pesanan</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">ℹ️</span>
            <span class="nav-label">Info</span>
        </a>
        <a href="#" class="nav-item">
            <span class="nav-icon">🎧</span>
            <span class="nav-label">Admin</span>
        </a>
    </nav>

</body>
</html>
