<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TumbasAkun.id</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Ramping Minimalis -->
    <header>
        <button class="menu-btn" aria-label="Menu">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="flag-icon" title="Indonesia">
            <svg width="32" height="20" viewBox="0 0 32 20" rx="3">
                <rect width="32" height="10" fill="#E70011"/>
                <rect y="10" width="32" height="10" fill="#FFFFFF"/>
            </svg>
        </div>
    </header>

    <!-- Banner Utama -->
    <section class="hero">
        <h1>Pusat Akun Digital Terpercaya</h1>
        <p>Proses cepat, aman, dan bergaransi.</p>
        <button class="btn-main" onclick="sapaPembeli()">Jelajahi Produk</button>
    </section>

    <main class="container">
        <!-- Tempat Katalog Produk -->
    </main>

    <script src="script.js"></script>
</body>
</html>
