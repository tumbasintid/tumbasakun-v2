<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUMBASAKUN</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header Atas -->
    <header>
        <button class="menu-btn" aria-label="Menu">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round">
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
        </button>

        <div class="flag-icon" title="Indonesia">
            <svg width="32" height="20" viewBox="0 0 32 20">
                <rect width="32" height="10" fill="#E70011"/>
                <rect y="10" width="32" height="10" fill="#FFFFFF"/>
            </svg>
        </div>
    </header>

    <!-- Banner Utama / Hero Section -->
    <section class="hero-section">
        <!-- Gambar Banner MLBB -->
        <div class="banner-img-container">
            <img src="https://images.unsplash.com/photo-1542751371-adc38448a05e?q=80&w=1000" alt="Banner Top" class="banner-img">
        </div>

        <!-- Logo Bulat (TA) -->
        <div class="logo-circle">
            <span>TA</span>
        </div>

        <!-- Judul & Deskripsi Toko -->
        <h1 class="store-title">TUMBASAKUN <span class="verified-badge">✔</span></h1>
        <p class="store-desc">
            Khusus Jual Beli Akun Advance Server Mobile Legends.<br>
            Nikmati Akses Fitur dan Hero Terbaru Lebih Awal.
        </p>

        <!-- Tombol Aksi Oranye -->
        <div class="action-buttons">
            <button class="btn-orange">Lihat Produk</button>
            <button class="btn-orange">Cara Order</button>
        </div>
    </section>

</body>
</html>
